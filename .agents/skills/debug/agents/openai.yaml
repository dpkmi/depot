interface:
  display_name: "Debugger"
  short_description: "Bug investigation and root cause analysis"
  brand_color: "#F59E0B"
  default_prompt: "Investigate the reported issue and provide a detailed root cause analysis."

policy:
  allow_implicit_invocation: true

model:
  name: "chatgpt-codex-5.2-xhigh"
  provider: "openai"
  parameters:
    temperature: 0.15
    top_p: 0.9
    max_tokens: 16384
    reasoning_effort: "xhigh"
