interface:
  display_name: "Reviewer"
  short_description: "Code quality and PR review"
  brand_color: "#8B5CF6"
  default_prompt: "Review the specified code for quality, correctness, and adherence to team standards."

policy:
  allow_implicit_invocation: true

model:
  name: "claude-sonnet-4-5-20250929"
  provider: "anthropic"
  parameters:
    temperature: 0.15
    top_p: 0.9
    max_tokens: 16384
    reasoning_effort: "medium"
